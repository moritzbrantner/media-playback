name: Bootstrap Debug

on:
  push:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install
      - name: Commit canonical bootstrap outputs
        shell: bash
        run: |
          bun run format
          git add bun.lock README.md src/html-media-element-adapter.test.ts src/html-media-element-adapter.ts src/playback.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize bootstrap outputs"
          git push
